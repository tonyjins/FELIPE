<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halloween 🎃</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', cursive, sans-serif;
        }

        body {
            background-color: #7b717c; /* Color de fondo idéntico a tu captura */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            overflow: hidden;
            position: relative;
        }

        /* Tarjeta principal */
        .card {
            background-color: #ffffff;
            width: 90%;
            max-width: 420px;
            padding: 35px 20px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            margin-bottom: 60px;
            z-index: 10;
        }

        .card h1 {
            color: #e8869c; /* Tono rosado de la pregunta */
            font-size: 1.5rem;
            margin-bottom: 25px;
            font-weight: 600;
            line-height: 1.3;
        }

        .buttons-container {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .btn {
            background-color: #ffb6c1; /* Rosado claro de los botones */
            color: #d16982;
            border: none;
            padding: 10px 25px;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        /* Pantalla de susto (Jumpscare) */
        #jumpscare {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.02s ease-in;
        }

        #jumpscare.active {
            opacity: 1;
            pointer-events: auto;
            animation: shake 0.1s infinite;
        }

        #jumpscare img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Animación de vibración */
        @keyframes shake {
            0% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-12px, 12px) rotate(-3deg); }
            40% { transform: translate(12px, -12px) rotate(3deg); }
            60% { transform: translate(-12px, -12px) rotate(-2deg); }
            80% { transform: translate(12px, 12px) rotate(2deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
    </style>
</head>
<body>

    <!-- Contenido de la portada -->
    <div class="card">
        <h1>¿Quieres celebrar Halloween conmigo?</h1>
        <div class="buttons-container">
            <button class="btn" onclick="triggerJumpscare()">🎃 Sí</button>
            <button class="btn" onclick="triggerJumpscare()">🕷️ No</button>
        </div>
    </div>

    <!-- Audio vinculado exactamente con el nombre de tu archivo -->
    <audio id="screamAudio" preload="auto">
        <source src="Grito desgarrador - Efecto de sonido [174cf2seqsl].mp3" type="audio/mpeg">
    </audio>

    <!-- Pantalla de Jumpscare con tu foto exacta -->
    <div id="jumpscare">
        <img src="Screenshot_2025-10-20-00-03-29-281_com.google.android.apps.photos.jpg" alt="Susto">
    </div>

    <script>
        function triggerJumpscare() {
            const jumpscareDiv = document.getElementById('jumpscare');
            const audio = document.getElementById('screamAudio');

            // Reproducir sonido
            audio.currentTime = 0;
            audio.play().catch(error => {
                console.log("Error al reproducir audio:", error);
            });

            // Activar pantalla de susto
            jumpscareDiv.classList.add('active');
        }
    </script>
</body>
      </html>
